name: CI — AgriIrrigation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-auth:
    name: Test auth-service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agri
          POSTGRES_PASSWORD: agri123
          POSTGRES_DB: auth_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agri-auth-service/package-lock.json
      - run: npm ci
        working-directory: agri-auth-service
      - run: npm test
        working-directory: agri-auth-service
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USER: agri
          DB_PASSWORD: agri123
          DB_NAME: auth_db
          JWT_SECRET: test-secret

  test-irrigation:
    name: Test irrigation-service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agri
          POSTGRES_PASSWORD: agri123
          POSTGRES_DB: irrigation_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agri-irrigation-service/package-lock.json
      - run: npm ci
        working-directory: agri-irrigation-service
      - run: npm test
        working-directory: agri-irrigation-service
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USER: agri
          DB_PASSWORD: agri123
          DB_NAME: irrigation_db
          JWT_SECRET: test-secret

  test-notification:
    name: Test notification-service
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agri-notification-service/package-lock.json
      - run: npm ci
        working-directory: agri-notification-service
      - run: npm test
        working-directory: agri-notification-service
        env:
          MONGODB_URI: mongodb://localhost:27017/test_notifications
          JWT_SECRET: test-secret

  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test-auth, test-irrigation, test-notification]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all images
        run: |
          docker build -t agri-auth-service:test ./agri-auth-service
          docker build -t agri-irrigation-service:test ./agri-irrigation-service
          docker build -t agri-notification-service:test ./agri-notification-service
          docker build -t agri-frontend:test ./agri-frontend
