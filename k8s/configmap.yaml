apiVersion: v1
kind: ConfigMap
metadata:
  name: agri-config
  namespace: agri-irrigation
data:
  POSTGRES_HOST: postgres-service
  POSTGRES_PORT: "5432"
  AUTH_DB_NAME: auth_db
  IRRIGATION_DB_NAME: irrigation_db
  JWT_EXPIRES_IN: 24h
  AUTH_SERVICE_PORT: "3000"
  IRRIGATION_SERVICE_PORT: "3001"
  NOTIFICATION_SERVICE_PORT: "3002"
  # URI MongoDB sans credentials (user/password injectés depuis le Secret)
  MONGODB_HOST: mongodb-service
  MONGODB_PORT: "27017"
  MONGODB_DB_NAME: notifications_db
