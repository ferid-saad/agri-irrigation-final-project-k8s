apiVersion: apps/v1
kind: Deployment
metadata:
  name: irrigation-service
  namespace: agri-irrigation
  labels:
    app: irrigation-service
    app.kubernetes.io/name: irrigation-service
    app.kubernetes.io/part-of: agri-irrigation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: irrigation-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: irrigation-service
        app.kubernetes.io/name: irrigation-service
        app.kubernetes.io/part-of: agri-irrigation
    spec:
      serviceAccountName: irrigation-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: irrigation-service
          image: feridsaad/agri-irrigation-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: PORT
              value: "3001"
            - name: DB_HOST
              value: postgres-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: agri-config
                  key: IRRIGATION_DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: agri-secrets
                  key: postgres-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agri-secrets
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agri-secrets
                  key: jwt-secret
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: agri-config
                  key: JWT_EXPIRES_IN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
