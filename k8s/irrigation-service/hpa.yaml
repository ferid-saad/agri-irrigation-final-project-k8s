apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: irrigation-service-hpa
  namespace: agri-irrigation
  labels:
    app: irrigation-service
    app.kubernetes.io/name: irrigation-service
    app.kubernetes.io/part-of: agri-irrigation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: irrigation-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
