apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agri-ingress
  namespace: agri-irrigation
  labels:
    app.kubernetes.io/name: agri-ingress
    app.kubernetes.io/part-of: agri-irrigation
spec:
  ingressClassName: traefik
  rules:
    - host: agri.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80