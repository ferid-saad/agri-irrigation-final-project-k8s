# PodDisruptionBudget for auth-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: agri-irrigation
  labels:
    app: auth-service
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: agri-irrigation
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-service

