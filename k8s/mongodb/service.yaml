apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: agri-irrigation
  labels:
    app: mongodb
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: agri-irrigation
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP
